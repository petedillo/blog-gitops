name: Renovate

on:
  schedule:
    # Run hourly
    - cron: '0 * * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run when config changes
  push:
    branches:
      - main
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate.yml'

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v41
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_HOST_RULES: '[{"matchHost":"docker.toastedbytes.com","hostType":"docker","username":"renovate","password":"${{ secrets.RENOVATE_DOCKER_PASSWORD }}"}]'
          LOG_LEVEL: debug
