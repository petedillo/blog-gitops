apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog-api-dev
  namespace: argocd
spec:
  project: petedillo-dev
  
  source:
    repoURL: https://github.com/[username]/blog-infra
    targetRevision: main
    path: kubernetes/overlays/dev
    kustomize:
      images:
      - name: blog-api
        newName: ghcr.io/[username]/blog-api
        newTag: develop
  
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
