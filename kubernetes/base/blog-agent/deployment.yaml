apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-agent
  labels:
    app: blog-agent
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: blog-agent
  template:
    metadata:
      labels:
        app: blog-agent
    spec:
      imagePullSecrets:
      - name: nexus-registry
      containers:
      - name: blog-agent
        image: docker.toastedbytes.com/blog-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3004"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: blog-agent-config
        - secretRef:
            name: blog-agent-image-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5
