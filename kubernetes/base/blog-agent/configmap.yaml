apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-agent-config
  namespace: blog-dev
data:
  # Ollama LLM provider
  OLLAMA_BASE_URL: "http://192.168.50.59:11434"
  OLLAMA_MODEL: "petedio-writer"

  # Internal service URLs (K8s DNS)
  BLOG_API_URL: "http://blog-api:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service.mission-control.svc.cluster.local:3002"
  MC_BACKEND_URL: "http://mission-control-backend.mission-control.svc.cluster.local:3001"

  # Blog URL for draft review links in Discord notifications
  BLOG_URL: "http://192.168.50.241"

  # CORS
  CORS_ORIGINS: "http://192.168.50.241,http://localhost:5173"
