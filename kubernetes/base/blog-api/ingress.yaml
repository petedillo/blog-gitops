apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: dev.petedillo.com
    http:
      paths:
      # Admin UI routes (served by Spring MVC/Thymeleaf)
      - path: /manage
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080

      # Public API routes
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080

      # Health endpoint
      - path: /api/v1/health
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080

      # Media API (images served from /app/media)
      - path: /api/v1/media
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
