apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
spec:
  ingressClassName: public
  rules:
  - host: blog.homelab.local
    http:
      paths:
      # Admin API routes (consumed by blog-agent/automation)
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      # Public API routes
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
