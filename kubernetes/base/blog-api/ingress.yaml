apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
spec:
  ingressClassName: public
  rules:
  - host: blog.homelab.local
    http:
      paths:
      # API routes (includes /api/v1/admin/* for blog-agent/automation)
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
