apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-ui
  namespace: dev
  labels:
    app: blog-ui
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: blog-ui
  template:
    metadata:
      labels:
        app: blog-ui
    spec:
      imagePullSecrets:
      - name: nexus-registry
      containers:
      - name: blog-ui
        image: docker.toastedbytes.com/blog-ui:74b4f8536ec96fb2a905b3603573c5c1ce333c33
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
