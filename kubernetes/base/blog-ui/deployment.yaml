apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-ui
  namespace: dev
  labels:
    app: blog-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-ui
  template:
    metadata:
      labels:
        app: blog-ui
    spec:
      imagePullSecrets:
      - name: nexus-registry
      containers:
      - name: blog-ui
        image: docker.toastedbytes.com/blog-ui:main-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "https://api.dev.petedillo.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
