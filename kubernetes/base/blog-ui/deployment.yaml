apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-ui
  labels:
    app: blog-ui
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-ui
  template:
    metadata:
      labels:
        app: blog-ui
    spec:
      containers:
      - name: blog-ui
        image: ghcr.io/[username]/blog-ui:develop
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "http://blog-api:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
