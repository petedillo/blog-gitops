apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-prod

resources:
  - namespace.yaml
  - ../../base/postgres
  - ../../base/blog-api
  - ../../base/blog-ui
  - networkpolicy-postgres.yaml
  - sealed-secrets/postgres-credentials.yaml
  - sealed-secrets/blog-app-credentials.yaml
  - sealed-secrets/nexus-registry.yaml
  - network-policies.yaml

patches:
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blog-api
  - path: blog-ui-deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blog-ui
  - path: blog-ui-service-patch.yaml
    target:
      version: v1
      kind: Service
      name: blog-ui
  - path: blog-api-service-patch.yaml
    target:
      version: v1
      kind: Service
      name: blog-api
  - path: postgres-service-patch.yaml
    target:
      version: v1
      kind: Service
      name: postgres
