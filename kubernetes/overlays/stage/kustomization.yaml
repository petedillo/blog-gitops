apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-stage

resources:
  - namespace.yaml
  - ../../base/postgres
  - ../../base/blog-api
  - ../../base/blog-ui
  - networkpolicy-postgres.yaml
  - media-pv-stage.yaml
  - media-pvc-stage.yaml

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blog-api
  - path: ui-ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blog-ui
  - path: api-deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blog-api
  - path: postgres-deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: postgres

labels:
  - includeSelectors: true
    pairs:
      environment: stage
