apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Using Cloudflare origin certificate for end-to-end encryption
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - stage.petedillo.com
    secretName: cloudflare-origin-cert
  rules:
  - host: stage.petedillo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blog-ui
            port:
              number: 80
