apiVersion: v1
kind: PersistentVolume
metadata:
  name: blog-media-pv-stage
  labels:
    type: nfs
    environment: stage
spec:
  capacity:
    storage: 1Ti
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.50.60
    path: /mnt/blog-media
  mountOptions:
  - nfsvers=4.2
  - hard
  - intr