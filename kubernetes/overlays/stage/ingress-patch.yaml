apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-http-errors: "404,500,502,503"
    # Using Cloudflare origin certificate for end-to-end encryption
    # Allow Cloudflare IP ranges, internal K8s network, and tunnel IP
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,192.168.50.51/32,10.0.0.0/8"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - stage.petedillo.com
    secretName: cloudflare-origin-cert
  rules:
  - host: stage.petedillo.com
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /manage
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/health
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/media
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
