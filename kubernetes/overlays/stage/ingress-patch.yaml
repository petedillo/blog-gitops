apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/custom-http-errors: "404,500,502,503"
    # Using Cloudflare origin certificate for end-to-end encryption
    # Restrict to Cloudflare tunnel IP and internal K8s network
    nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.50.51/32,10.0.0.0/8"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - stage.petedillo.com
    secretName: cloudflare-origin-cert
  rules:
  - host: stage.petedillo.com
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /manage
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/health
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/media
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
