apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
spec:
  ingressClassName: public
  rules:
  - host: dev.petedillo.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
  # Public access via Cloudflare Tunnel — UI on blog.pdlab.dev calls /api/v1 on the same host
  - host: blog.pdlab.dev
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
