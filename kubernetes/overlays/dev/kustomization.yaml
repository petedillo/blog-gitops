apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-dev

resources:
  - namespace.yaml
  - ../../base/postgres
  - ../../base/blog-api
  - ../../base/blog-ui
  - ../../base/media-storage
  - networkpolicy-postgres.yaml

patches:
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blog-api
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blog-api
  - path: ui-ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blog-ui

labels:
  - includeSelectors: true
    pairs:
      environment: dev
