apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base/blog-ui
  - ../../base/blog-api
  - ../../base/postgres

namespace: dev
namePrefix: dev-

patches:
  - path: blog-ui-patch.yaml
    target:
      kind: Deployment
      name: blog-ui
  - path: blog-api-patch.yaml
    target:
      kind: Deployment
      name: blog-api
  - path: postgres-patch.yaml
    target:
      kind: StatefulSet
      name: postgres
