apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-dev

resources:
- namespace.yaml
- ../../base/postgres
- ../../base/blog-api
- ../../base/blog-ui
- ../../base/monitoring
- ../../base/media-storage
- networkpolicy-postgres.yaml

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blog-api

labels:
- pairs:
    environment: dev
