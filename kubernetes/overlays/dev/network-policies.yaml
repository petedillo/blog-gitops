apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ui
spec:
  podSelector:
    matchLabels:
      app: blog-ui
  ingress:
    - {} # Allow all — serves LoadBalancer VIP and ingress controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
spec:
  podSelector:
    matchLabels:
      app: blog-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: blog-ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 3000
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: blog-api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
spec:
  podSelector:
    matchLabels:
      app: blog-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.50.59/32
      ports:
        - port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-to-api
spec:
  podSelector:
    matchLabels:
      app: blog-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: blog-agent
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mc-backend-to-agent
spec:
  podSelector:
    matchLabels:
      app: blog-agent
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mission-control
          podSelector:
            matchLabels:
              app: mission-control-backend
      ports:
        - port: 3004
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-egress
spec:
  podSelector:
    matchLabels:
      app: blog-agent
  policyTypes:
    - Egress
  egress:
    # Ollama for LLM inference
    - to:
        - ipBlock:
            cidr: 192.168.50.59/32
      ports:
        - port: 11434
    # blog-api for saving drafts
    - to:
        - podSelector:
            matchLabels:
              app: blog-api
      ports:
        - port: 3000
        - port: 8080
    # MC Backend for status reporting + SSE event stream
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mission-control
          podSelector:
            matchLabels:
              app: mission-control-backend
      ports:
        - port: 3000
    # notification-service for Discord alerts
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mission-control
          podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 3002
