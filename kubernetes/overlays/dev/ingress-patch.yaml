apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/custom-http-errors: "404,500,502,503"
spec:
  rules:
  - host: dev.petedillo.com
    http:
      paths:
      - path: /manage
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/health
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
      - path: /api/v1/media
        pathType: Prefix
        backend:
          service:
            name: blog-api
            port:
              number: 8080
